<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ restaurant.name }}{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="site">
    <a class="brand" href="/call?restaurant_id={{ restaurant._id|urlencode }}">{{ restaurant.name }}</a>
    <nav aria-label="Main">
      <a href="/call?restaurant_id={{ restaurant._id|urlencode }}" {% if page == 'call' %}aria-current="page"{% endif %}>Order by voice</a>
      <a href="/menu?restaurant_id={{ restaurant._id|urlencode }}" {% if page == 'menu' %}aria-current="page"{% endif %}>Menu</a>
    </nav>
  </header>
  <main id="main">{% block content %}{% endblock %}</main>
</body>
</html>
